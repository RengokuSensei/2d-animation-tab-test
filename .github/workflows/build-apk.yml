name: Build FrameForge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment and keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          touch app/proguard-rules.pro
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: List built APKs
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.0.0 exists. Updating APK asset..."
            gh release upload v1.0.0 app/build/outputs/apk/debug/app-debug.apk --clobber --repo "${{ github.repository }}"
          else
            echo "Creating Release v1.0.0 with APK..."
            gh release create v1.0.0 app/build/outputs/apk/debug/app-debug.apk \
              --title "FrameForge v1.0.0 - Cinematic 2D Animation Studio" \
              --notes "### 🎬 FrameForge v1.0.0 - Latest Automated Build\n\nDownload \`app-debug.apk\` below to install directly on your Android tablet." \
              --repo "${{ github.repository }}"
          fi

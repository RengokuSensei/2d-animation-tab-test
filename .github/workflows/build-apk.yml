name: Build FrameForge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk &> /dev/null; then
            cargo install cargo-ndk
          fi

      - name: Build Rust Native Engine (libframeforge.so)
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$NDK_DIR" ]; then
              echo "Installing Android NDK 26.1.10909125..."
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" || true
              NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
            fi
            export ANDROID_NDK_HOME="$NDK_DIR"
            export ANDROID_NDK_ROOT="$NDK_DIR"
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"

          mkdir -p app/src/main/jniLibs
          cd rust-core
          cargo ndk --platform 24 -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release -p frameforge-jni
          cd ..
          echo "Native libraries successfully compiled:"
          find app/src/main/jniLibs -name "*.so"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment and keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          touch app/proguard-rules.pro
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: List built APKs
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating APK asset..."
            gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
          else
            echo "Creating Release $TAG with APK..."
            gh release create "$TAG" "$APK" \
              --title "FrameForge v1.3.0 - Hybrid Rust Core & Tablet Bugfixes" \
              --notes $'### ⚡ FrameForge v1.3.0 — Hybrid Rust Engine & Tablet Overhaul\n\n- 🦀 **Native Rust Engine (`libframeforge.so`)**: Compiled for ARM64 (Snapdragon 8s Gen 3) & x86_64, featuring SIMD ASC CDL grading and Catmull-Rom spline path smoothing.\n- ✏️ **DRAW Workspace Fix**: Eliminated 250% stylus coordinate translation offset on high-DPI displays.\n- ✂️ **EDIT Workspace Fix**: Live compositing video monitor displaying frame cels and video track frames.\n- 🕸️ **NODES Workspace Fix**: Touch dragging unblocked, auto-spaced columns (60dp, 720dp, 1380dp) prevent card overlapping, and full inspector controls for `LAYER_SOURCE` & `COMPOSITE_OUTPUT`.\n- 🚀 **DELIVER Workspace Fix**: Real-time per-frame export progress gauge, automated export to tablet Gallery (`Movies/FrameForge`), plus immediate Play & Share buttons.\n\nDownload `app-debug.apk` below to install directly on your tablet.' \
              --repo "${{ github.repository }}"
          fi

          # Also keep v1.0.0 updated for backward compatibility
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 "$APK" --clobber --repo "${{ github.repository }}" || true
          fi

name: Build FrameForge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk &> /dev/null; then
            cargo install cargo-ndk
          fi

      - name: Build Rust Native Engine (libframeforge.so)
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$NDK_DIR" ]; then
              echo "Installing Android NDK 26.1.10909125..."
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" || true
              NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
            fi
            export ANDROID_NDK_HOME="$NDK_DIR"
            export ANDROID_NDK_ROOT="$NDK_DIR"
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"

          mkdir -p app/src/main/jniLibs
          cd rust-core
          cargo ndk --platform 24 -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release -p frameforge-jni
          cd ..
          echo "Native libraries successfully compiled:"
          find app/src/main/jniLibs -name "*.so"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment and keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          touch app/proguard-rules.pro
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: List built APKs
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.5.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating APK asset..."
            gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
          else
            echo "Creating Release $TAG with APK..."
            gh release create "$TAG" "$APK" \
              --title "FrameForge v1.5.0 - A2 Studio Adoption & Concepts Drawing Wheel" \
              --notes $'### 🎨 FrameForge v1.5.0 — Complete A2 Studio & Concepts Drawing Overhaul\n\n- 🎯 **1:1 Adoption of A2 Studio Blueprint**: Adopted cleanly from `A2_studio.html` with zero remnants of legacy Procreate toolbars or workspace tabs.\n- 🎡 **Concepts 8-Wedge Radial Tool Wheel**: Authentic radial wheel with Pen, Soft Pencil, Fill, Lasso, Nudge, Slice, Hard Mask, and Watercolor wedges.\n- ⚙️ **Radial Inner Hub Controls**: Stroke Size pts button (with presets 3pt, 8pt, 30pt, 37.5pt), Active Color hub button, Smoothing % button (with 0%, 10%, 50%, 100% presets), and Opacity % button.\n- 📐 **Concepts Precision Stack**: Collapsible precision dock with Grid (No Grid, Dot, Square, Isometric), Snap (To Grid/Guide), Measure (1:1 pts readout), Guide (Arc, Line, Ellipse, Rect), Shape Recognition (Auto-Snap), and quick Text/Ref/Clear tools.\n- 🌈 **Concentric Radial COPIC Color Wheel**: 12 chromatic color families with COPIC codes (R27 Cadmium Red, B14 Light Blue, etc.), Eyedropper, and HSL/RGB modes.\n- 🖌️ **Brushes & Texture Market Drawer**: Live interactive scratchpad canvas to test brush responsiveness before selecting, plus 10 categorized brush packs.\n- 📄 **PDF Reference & Documentary Carousel Shelf**: Stepper (Page 12/48), stage background toggle, and "Extract Diagram as Cel" vector transfer.\n- 🖼️ **Photo Asset Inspector**: Floating inspector with Tracing Opacity, Flip H/V, Crop, and Chroma Key / White Paper background removal.\n- ⏱️ **40dp Diamond Scrubber & Expanded NLE Studio**: Play/Pause, Step Prev/Next, Frame readout, Diamond keyframe strip, Add/Duplicate frame, FPS selector, and full multi-track NLE drawer (Track C1 2D cels, Track V1 Video PiP, Track A1 Voiceover with live VU meter, Track A2 Foley).\n- 🎛️ **Studio Mode Overlays**: Interactive Node Compositor DAG, Universal Object Velocity Bezier Curve Editor, Live 3-Way Color Grading wheels, and 3D Multiplane Depth Stage.\n- 🦀 **Rust Native Core Powered**: `libframeforge.so` bundled with SIMD acceleration and 144Hz stylus tracking.\n- 🎬 **One-Click Gallery Export**: Real-time progress bar saving directly to `Movies/FrameForge` with instant system Share intent.\n\nDownload `app-debug.apk` below to install directly on your Android tablet.' \
              --repo "${{ github.repository }}"
          fi

          # Also keep v1.0.0 updated for backward compatibility
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 "$APK" --clobber --repo "${{ github.repository }}" || true
          fi

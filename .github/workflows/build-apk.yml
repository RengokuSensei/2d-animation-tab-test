name: Build FrameForge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v1

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk &> /dev/null; then
            cargo install cargo-ndk
          fi

      - name: Build Rust Native Engine (libframeforge.so)
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$NDK_DIR" ]; then
              echo "Installing Android NDK 26.1.10909125..."
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" || true
              NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
            fi
            export ANDROID_NDK_HOME="$NDK_DIR"
            export ANDROID_NDK_ROOT="$NDK_DIR"
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"

          mkdir -p app/src/main/jniLibs
          cd rust-core
          cargo ndk --platform 24 -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release -p frameforge-jni
          cd ..
          echo "Native libraries successfully compiled:"
          find app/src/main/jniLibs -name "*.so"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment and keystore
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          touch app/proguard-rules.pro
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: List built APKs
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frameforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.7.0"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating APK asset..."
            gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
          else
            echo "Creating Release $TAG with APK..."
            gh release create "$TAG" "$APK" \
              --title "FrameForge v1.7.0 - Persistent Logs Taker, NLE Video Editor & Canvas Touch Fixes" \
              --notes $'### 🚀 FrameForge v1.7.0 — Persistent Logs Taker, Real NLE Video Editor & Touch Fixes\n\n- 🛡️ **Persistent Action & Crash Logger ("Logs Taker")**: Global uncaught exception handler catching crashes mid-session, recording system metrics, thread forensics, stack trace, and 500 action breadcrumbs to `crash_latest.txt` on storage.\n- 📋 **In-App Logs Modal**: Real-time terminal log viewer with category filters (ALL, CRASHES, UI, TOUCH, PLAYBACK, VIDEO, ERRORS), "Copy All", "Share Log File", and "Clear Logs".\n- 🎬 **Functional NLE Video Editor & PiP B-Roll Stage**: 1:1 parity with `A2_studio.html`. Interactive Track V1 filmstrip with In/Out trim handles, Razor Split, Ripple Delete, Speed multiplier (0.5x, 1x, 1.5x, 2x), and real video file import (`video/*`).\n- 🛰️ **Cinematic Documentary B-Roll PiP**: Animated telemetry HUD, celestial orbits, SMPTE timecode overlay, and toggle between Floating PiP Box and Full Canvas Underlay for rotoscoping/tracing.\n- ⏱️ **Smooth Continuous Timeline Playback**: Fixed loop advancing `currentFrame` at configured FPS (8/12/24 fps), updating diamond scrubber, 2D cels, and video stage synchronously.\n- ✍️ **Canvas Touch & Palm Rejection Fix**: Finger touches draw immediately out-of-the-box (`PalmRejectionMode.FINGER_AND_STYLUS` default, `FingerTouchMode.DRAW` default, `touchMajor > 200f` palm threshold).' \
              --repo "${{ github.repository }}"
          fi

          # Also keep v1.6.0 and v1.0.0 updated for backward compatibility
          if gh release view v1.6.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.6.0 "$APK" --clobber --repo "${{ github.repository }}" || true
          fi
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 "$APK" --clobber --repo "${{ github.repository }}" || true
          fi
